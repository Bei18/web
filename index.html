<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>应用展示</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f5f5f7;
            color: #333;
            line-height: 1.5;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 24px;
            background: #fff;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }

        .logo {
            height: 40px;
            object-fit: contain;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 24px;
        }

        /* 轮播图区域自适应容器 */
        .carousel-container {
            position: relative;
            width: 100%;
            height: 400px; /* 固定高度容器 */
            background-color: #1e1e1e; /* 暗色背景凸显自适应图片 */
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 16px rgba(0,0,0,0.1);
            margin-bottom: 32px;
        }

        .carousel-slide {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* 核心：自适应完整显示图片 */
        .carousel-slide img {
            width: 100%;
            height: 100%;
            object-fit: contain; /* 关键：完整显示，按比例缩放，不被裁剪 */
            display: block;
        }

        /* 功能卡片网格布局 */
        .features-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 20px;
        }

        .card {
            background: #fff;
            border-radius: 12px;
            border: 1px solid #e5e5e5;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 24px rgba(0,0,0,0.08);
        }

        /* 功能卡片图片容器 */
        .card-image-wrapper {
            width: 100%;
            height: 220px; /* 统一卡片图片高度 */
            background-color: #fafafa;
            border-radius: 8px;
            border: 1px solid #eee;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 12px;
            padding: 8px;
        }

        /* 卡片图片自适应 */
        .card-image-wrapper img {
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: auto;
            object-fit: contain; /* 确保不规则尺寸图片完全展现 */
        }

        .card-title {
            font-size: 16px;
            font-weight: 600;
            margin-top: 8px;
            color: #1d1d1f;
        }

        .footer {
            margin-top: 48px;
            padding: 24px;
            text-align: center;
            font-size: 14px;
            color: #86868b;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .beian-icon {
            width: 16px;
            height: 16px;
            object-fit: contain;
        }
    </style>
</head>
<body>

    <header class="header">
        <img id="app-logo" src="" alt="Logo" class="logo">
    </header>

    <div class="container">
        <!-- 轮播展示区 -->
        <div class="carousel-container">
            <div class="carousel-slide">
                <img id="carousel-img" src="" alt="Carousel Image">
            </div>
        </div>

        <!-- 功能卡片展示区 -->
        <div class="features-grid">
            <div class="card">
                <div class="card-image-wrapper">
                    <img id="feature-card1" src="" alt="Feature 1">
                </div>
                <div class="card-title">功能特点 1</div>
            </div>
            <div class="card">
                <div class="card-image-wrapper">
                    <img id="feature-card2" src="" alt="Feature 2">
                </div>
                <div class="card-title">功能特点 2</div>
            </div>
            <div class="card">
                <div class="card-image-wrapper">
                    <img id="feature-card3" src="" alt="Feature 3">
                </div>
                <div class="card-title">功能特点 3</div>
            </div>
            <div class="card">
                <div class="card-image-wrapper">
                    <img id="feature-card4" src="" alt="Feature 4">
                </div>
                <div class="card-title">功能特点 4</div>
            </div>
        </div>
    </div>

    <footer class="footer">
        <img id="beian-icon" class="beian-icon" src="" alt="备案图标">
        <span>备案信息展示</span>
    </footer>

    <script>
        // 配置数据（已为您修复路径后缀）
        const APP_CONFIG = {
            images: {
                logo: "https://xiehouma.com/assets/logo_108.3d12caea.png",
                beianIcon: "assets/images/beian-icon.png",
                carousel: [
                    "4933c4a1783b45d08779c9cab6951cb6.jpg",
                    "4933c4a1783b45d08779c9cab6951cb6 (1).jpg",
                    "4933c4a1783b45d08779c9cab6951cb6 (2).jpg",
                    "4933c4a1783b45d08779c9cab6951cb6 (3).jpg"
                ],
                carouselFallbacks: [
                    "Snipaste_2026-09-03_22-17-28.png",
                    "Snipaste_2026-09-03_22-17-39.png",
                    "Snipaste_2026-09-03_22-17-47.png",
                    "Snipaste_2026-09-03_22-17-52.png"
                ],
                features: {
                    card1: "Snipaste_2026-09-03_22-17-28.png",
                    card2: "Snipaste_2026-09-03_22-17-39.png",
                    card3: "Snipaste_2026-09-03_22-17-47.png",
                    card4: "Snipaste_2026-09-03_22-17-52.png"
                }
            }
        };

        // 渲染与轮播逻辑
        document.addEventListener("DOMContentLoaded", () => {
            // 加载基础图标
            document.getElementById("app-logo").src = APP_CONFIG.images.logo;
            document.getElementById("beian-icon").src = APP_CONFIG.images.beianIcon;

            // 加载功能卡片图片（带有失败回退处理）
            Object.keys(APP_CONFIG.images.features).forEach(key => {
                const imgEl = document.getElementById(`feature-${key}`);
                if (imgEl) {
                    imgEl.src = APP_CONFIG.images.features[key];
                    imgEl.onerror = function() {
                        this.style.display = 'none'; // 加载失败时隐藏或设置默认图
                    };
                }
            });

            // 轮播图自动播放逻辑
            const carouselImg = document.getElementById("carousel-img");
            let currentIndex = 0;
            const carouselList = APP_CONFIG.images.carousel;

            function updateCarousel() {
                carouselImg.src = carouselList[currentIndex];
                carouselImg.onerror = function() {
                    // 如果主图片加载失败，尝试使用 fallback 备份图片
                    if (APP_CONFIG.images.carouselFallbacks[currentIndex]) {
                        this.src = APP_CONFIG.images.carouselFallbacks[currentIndex];
                    }
                };
            }

            // 初始化显示第一张
            updateCarousel();

            // 每 3 秒切换一次图片
            setInterval(() => {
                currentIndex = (currentIndex + 1) % carouselList.length;
                updateCarousel();
            }, 3000);
        });
    </script>
</body>
</html>
