<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XChat</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Hero 区域 -->
    <section class="hero-section">
        <!-- 高科技微动态背景特效 -->
        <div class="tech-bg-grid"></div>
        <div class="tech-glow-orb"></div>

        <div class="hero-container">
            <!-- Hero 左侧文案与新增跳转按钮 -->
            <div class="hero-text">
                <h1 class="hero-title">什么是“XChat”？</h1>
                <p class="hero-description">XChat 是一款高效、安全且支持多端同步的新一代智能即时通讯工具。</p>
                <div class="hero-buttons">
                    <a href="#download" class="btn btn-primary">下载 XChat</a>
                    <a href="#features" class="btn btn-secondary">了解产品能力</a>
                </div>
            </div>

            <!-- Hero 右侧视觉区域 (带有半透明底色) -->
            <div class="hero-visual">
                <div class="chat-mockup">
                    <div class="mockup-header">
                        <div class="mockup-dots"><span></span><span></span><span></span></div>
                        <span class="mockup-title" data-i18n="hero.mockup.title">码讯IM · 和好友聊天</span>
                    </div>
                    
                    <!-- 内部主体布局容器（修复对齐与高亮） -->
                    <div class="mockup-body">
                        <div class="mockup-sidebar">
                            <div class="sidebar-item active">
                                <div class="avatar">小</div>
                                <div class="chat-info">
                                    <span class="chat-name" data-i18n="hero.friend1.name">小美</span>
                                    <span class="chat-preview" data-i18n="hero.friend1.preview">周末一起去爬山吧 🏔️</span>
                                </div>
                            </div>
                            <div class="sidebar-item">
                                <div class="avatar">阿</div>
                                <div class="chat-info">
                                    <span class="chat-name" data-i18n="hero.friend2.name">阿杰</span>
                                    <span class="chat-preview" data-i18n="hero.friend2.preview">那个电影超好看！</span>
                                </div>
                            </div>
                            <div class="sidebar-item">
                                <div class="avatar">🏀</div>
                                <div class="chat-info">
                                    <span class="chat-name" data-i18n="hero.friend3.name">篮球群</span>
                                    <span class="chat-preview" data-i18n="hero.friend3.preview">今晚谁来打球？</span>
                                </div>
                            </div>
                        </div>
                        
                        <div class="mockup-content">
                            <div class="message message-received">
                                <span class="message-text" data-i18n="hero.msg1">周末一起去爬山吧，天气预报说是大晴天！</span>
                                <span class="message-time">10:30</span>
                            </div>
                            <div class="message message-sent">
                                <span class="message-text" data-i18n="hero.msg2">好呀！叫上阿杰一起 😄</span>
                                <span class="message-time">10:32</span>
                            </div>
                            <div class="message message-received">
                                <span class="message-text" data-i18n="hero.msg3">已经约好啦，他说带上他的新相机 📷</span>
                                <span class="message-time">10:33</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- 产品能力介绍区域 (锚点: #features) -->
    <section id="features" class="features-section">
        <div class="section-container">
            <h2>产品能力</h2>
            <!-- 你的产品能力介绍内容放置在这里 -->
        </div>
    </section>

    <!-- 下载区域 (锚点: #download) -->
    <section id="download" class="download-section">
        <div class="section-container">
            <h2>下载 XChat</h2>
            <p>选择适合您的平台开始使用</p>
            <!-- 你的下载选项/客户端二维码内容放置在这里 -->
        </div>
    </section>

</body>
</html>
