<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>邂逅码 Web</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap');
        body {
            font-family: 'Inter', sans-serif;
        }
        /* 顶部主题颜色背景条 */
        .header-bg {
            background-color: #10b981;
            height: 222px;
            width: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 0;
        }
        /* 隐藏滚动条但保留滚动功能 */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="bg-[#f0f2f5] min-h-screen relative flex flex-col justify-between selection:bg-[#10b981] selection:text-white">

    <div class="header-bg"></div>

    <main class="relative z-10 flex-grow flex items-center justify-center px-4 py-8">
        <div class="bg-white w-full max-w-[1040px] rounded-md shadow-xl flex flex-col md:flex-row min-h-[600px] overflow-hidden">
            
            <div class="w-full md:w-1/2 p-8 md:p-12 flex flex-col justify-between bg-white">
                <div>
                    <div class="flex items-center space-x-3 mb-8">
                        <img src="https://xiehouma.com/assets/logo_108.3d12caea.png" alt="邂逅码 Logo" class="w-10 h-10 object-contain rounded-lg">
                        <h1 class="text-xl font-medium text-[#41525d]">邂逅码 Web</h1>
                    </div>

                    <h2 class="text-2xl md:text-3xl font-light text-[#41525d] mb-6">
                        在电脑上使用 邂逅码
                    </h2>

                    <ol class="space-y-4 text-[#3b4a54] text-sm md:text-base">
                        <li class="flex items-start space-x-3">
                            <span class="flex-shrink-0 w-6 h-6 rounded-full bg-[#f0f2f5] text-[#10b981] font-semibold flex items-center justify-center text-xs">1</span>
                            <span>打开手机上的 邂逅码 App</span>
                        </li>
                        <li class="flex items-start space-x-3">
                            <span class="flex-shrink-0 w-6 h-6 rounded-full bg-[#f0f2f5] text-[#10b981] font-semibold flex items-center justify-center text-xs">2</span>
                            <span>点击菜单 <i data-lucide="more-vertical" class="inline w-4 h-4 mx-1"></i> 或设置 <i data-lucide="settings" class="inline w-4 h-4 mx-1"></i> 并选择 <strong>扫码识别</strong></span>
                        </li>
                        <li class="flex items-start space-x-3">
                            <span class="flex-shrink-0 w-6 h-6 rounded-full bg-[#f0f2f5] text-[#10b981] font-semibold flex items-center justify-center text-xs">3</span>
                            <span>将手机对准屏幕，扫描此处的二维码</span>
                        </li>
                    </ol>
                </div>

                <div class="mt-8 pt-4 border-t border-gray-100">
                    <!-- 已将 href 改为 https://bei18.github.io/web/ -->
                    <a href="https://bei18.github.io/web/index3.html" target="_blank" rel="noopener noreferrer" class="text-[#10b981] hover:underline text-sm font-medium flex items-center gap-1">
                        账号注册
                        <i data-lucide="external-link" class="w-3.5 h-3.5"></i>
                    </a>
                </div>
            </div>

            <div class="w-full md:w-1/2 p-8 md:p-12 flex flex-col items-center justify-center bg-white relative">
                
                <div class="relative group p-4 bg-white rounded-xl shadow-sm border border-gray-100 transition-all duration-300">
                    <div id="qr-container" class="relative w-64 h-64 flex items-center justify-center bg-gray-50 rounded-lg overflow-hidden">
                        <img id="qr-code-img" src="https://api.qrserver.com/v1/create-qr-code/?size=240x240&data=xiehouma_login_token_1" alt="邂逅码 二维码登录" class="w-60 h-60 object-contain transition-opacity duration-300">
                        
                        <div id="qr-mask" class="absolute inset-0 bg-white/90 backdrop-blur-sm flex flex-col items-center justify-center opacity-0 pointer-events-none transition-opacity duration-300">
                            <i data-lucide="refresh-cw" class="w-10 h-10 text-[#10b981] animate-spin mb-2"></i>
                            <span class="text-xs font-medium text-gray-600">正在刷新二维码...</span>
                        </div>
                    </div>

                    <div id="refresh-btn" onclick="refreshQRCode()" class="absolute inset-0 bg-white/95 flex flex-col items-center justify-center opacity-0 group-hover:opacity-100 cursor-pointer transition-opacity duration-200 rounded-xl">
                        <div class="w-12 h-12 rounded-full bg-[#10b981] text-white flex items-center justify-center shadow-md mb-2 hover:scale-105 transition-transform">
                            <i data-lucide="refresh-cw" class="w-6 h-6"></i>
                        </div>
                        <span class="text-sm font-medium text-[#41525d]">点击刷新二维码</span>
                    </div>
                </div>

                <div class="mt-6 flex items-center space-x-2 text-sm text-[#667781]">
                    <i data-lucide="clock" class="w-4 h-4 text-[#10b981]"></i>
                    <span>二维码将在 <strong id="countdown" class="text-[#10b981] font-semibold">30</strong> 秒后自动刷新</span>
                </div>

                <div class="mt-4 flex items-center space-x-2">
                    <input type="checkbox" id="keep-login" checked class="w-4 h-4 accent-[#10b981] rounded cursor-pointer">
                    <label for="keep-login" class="text-xs text-[#667781] cursor-pointer select-none">在这台电脑上保持登录状态</label>
                </div>
            </div>

        </div>
    </main>

    <footer class="relative z-10 py-6 text-center text-xs text-[#667781]">
        <p>2026 万维时代互联科技（山东）集团有限公司 版权所有</p>
    </footer>

    <script>
        // 初始化 Lucide 图标
        lucide.createIcons();

        let timeLeft = 30;
        let timer = null;
        const countdownEl = document.getElementById('countdown');
        const qrImg = document.getElementById('qr-code-img');
        const qrMask = document.getElementById('qr-mask');

        // 生成随机参数以触发新二维码加载
        function getNewQRUrl() {
            const randomId = Math.random().toString(36).substring(7);
            return `https://api.qrserver.com/v1/create-qr-code/?size=240x240&data=xiehouma_session_${randomId}`;
        }

        // 刷新二维码核心函数
        function refreshQRCode() {
            // 显示刷新动画遮罩
            qrMask.style.opacity = '1';
            qrMask.style.pointerEvents = 'auto';

            setTimeout(() => {
                // 替换图片源
                qrImg.src = getNewQRUrl();
                // 隐藏遮罩
                qrMask.style.opacity = '0';
                qrMask.style.pointerEvents = 'none';
                
                // 重置倒计时
                timeLeft = 30;
                countdownEl.textContent = timeLeft;
            }, 500); // 模拟半秒钟的加载感
        }

        // 启动倒计时定时器
        function startTimer() {
            if (timer) clearInterval(timer);
            timer = setInterval(() => {
                timeLeft--;
                countdownEl.textContent = timeLeft;
                
                if (timeLeft <= 0) {
                    refreshQRCode();
                }
            }, 1000);
        }

        // 页面加载完成后开始计时
        window.onload = () => {
            startTimer();
        };
    </script>
</body>
</html>
