<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>邂逅码 Web</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-[#f0f2f5] min-h-screen relative flex flex-col justify-between selection:bg-[#10b981] selection:text-white">

    <!-- 顶部绿色背景条 -->
    <div class="bg-[#10b981] h-56 w-full absolute top-0 left-0 z-0"></div>

    <!-- 自定义 Alert Toast 提醒 -->
    <div id="toast" class="fixed top-6 left-1/2 -translate-x-1/2 z-50 flex items-center gap-2 bg-red-500 text-white px-4 py-2.5 rounded-lg shadow-xl opacity-0 pointer-events-none transition-all duration-300 transform -translate-y-2 text-sm font-medium">
        <i data-lucide="alert-circle" class="w-4 h-4"></i>
        <span id="toast-msg">验证码错误，请重新输入</span>
    </div>

    <!-- 主体区域：居中布局 -->
    <main class="relative z-10 flex-grow flex items-center justify-center px-4 py-8">
        <div class="bg-white w-full max-w-[460px] rounded-xl shadow-2xl p-8 md:p-10 relative border border-gray-100">
            
            <!-- 头部 Logo & 切换按钮 -->
            <div class="flex items-center justify-between mb-8">
                <div class="flex items-center space-x-2.5">
                    <img src="https://xiehouma.com/assets/logo_108.3d12caea.png" alt="Logo" class="w-9 h-9 object-contain rounded-lg">
                    <h1 class="text-lg font-semibold text-[#41525d]">邂逅码 Web</h1>
                </div>

                <!-- 切换登录模式按钮 -->
                <button type="button" onclick="toggleMode()" class="text-xs font-medium text-[#10b981] hover:text-[#0d9668] flex items-center gap-1 border border-[#10b981] px-3 py-1.5 rounded-full transition-all bg-emerald-50/50">
                    <span id="toggle-btn-text">密码登录</span>
                    <i data-lucide="arrow-right" class="w-3.5 h-3.5"></i>
                </button>
            </div>

            <!-- 标题 -->
            <h2 class="text-xl font-medium text-[#41525d] mb-6 text-center" id="card-title">扫码登录 邂逅码</h2>

            <!-- 1. 二维码登录模式 -->
            <div id="qr-mode" class="flex flex-col items-center justify-center">
                <div class="relative group p-4 bg-white rounded-xl border border-gray-100 shadow-sm">
                    <div class="relative w-56 h-56 flex items-center justify-center bg-gray-50 rounded-lg overflow-hidden">
                        <img id="qr-code-img" src="https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=xiehouma_login_token_1" alt="二维码" class="w-52 h-52 object-contain">
                        <div id="qr-mask" class="absolute inset-0 bg-white/90 backdrop-blur-sm flex flex-col items-center justify-center opacity-0 pointer-events-none transition-opacity">
                            <i data-lucide="refresh-cw" class="w-8 h-8 text-[#10b981] animate-spin mb-2"></i>
                            <span class="text-xs text-gray-600">正在刷新...</span>
                        </div>
                    </div>
                    <div onclick="refreshQRCode()" class="absolute inset-0 bg-white/95 flex flex-col items-center justify-center opacity-0 group-hover:opacity-100 cursor-pointer transition-opacity rounded-xl">
                        <div class="w-10 h-10 rounded-full bg-[#10b981] text-white flex items-center justify-center shadow-md mb-2">
                            <i data-lucide="refresh-cw" class="w-5 h-5"></i>
                        </div>
                        <span class="text-xs font-medium text-[#41525d]">点击刷新</span>
                    </div>
                </div>

                <div class="mt-4 flex items-center space-x-2 text-xs text-[#667781]">
                    <i data-lucide="clock" class="w-3.5 h-3.5 text-[#10b981]"></i>
                    <span>二维码将在 <strong id="countdown" class="text-[#10b981]">30</strong> 秒后自动刷新</span>
                </div>

                <div class="mt-3 flex items-center space-x-2">
                    <input type="checkbox" id="keep-login-qr" checked class="w-4 h-4 accent-[#10b981] rounded cursor-pointer">
                    <label for="keep-login-qr" class="text-xs text-[#667781] cursor-pointer select-none">保持登录状态</label>
                </div>
            </div>

            <!-- 2. 账号密码登录模式（默认隐藏） -->
            <form id="pwd-mode" onsubmit="handleLogin(event)" class="hidden space-y-4">
                <div>
                    <label class="block text-xs font-medium text-gray-600 mb-1">账号/手机号</label>
                    <input type="text" id="username" maxlength="11" placeholder="请输入账号或手机号" class="w-full px-3.5 py-2.5 text-sm border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-[#10b981]/20 focus:border-[#10b981] transition-all">
                </div>

                <div>
                    <label class="block text-xs font-medium text-gray-600 mb-1">密码</label>
                    <input type="password" id="password" minlength="8" placeholder="请输入密码" class="w-full px-3.5 py-2.5 text-sm border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-[#10b981]/20 focus:border-[#10b981] transition-all">
                </div>

                <div>
                    <label class="block text-xs font-medium text-gray-600 mb-1">图形验证码</label>
                    <div class="flex gap-2.5">
                        <input type="text" id="captcha-input" placeholder="验证码" class="w-1/2 px-3.5 py-2.5 text-sm border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-[#10b981]/20 focus:border-[#10b981] transition-all">
                        <canvas id="captcha-canvas" width="120" height="42" onclick="generateCaptcha()" class="w-1/2 border border-gray-200 rounded-lg cursor-pointer bg-gray-50 hover:opacity-90 transition-opacity" title="点击刷新验证码"></canvas>
                    </div>
                </div>

                <button type="submit" id="login-btn" class="w-full py-2.5 mt-2 bg-[#10b981] hover:bg-[#0d9668] disabled:bg-[#a7f3d0] disabled:cursor-not-allowed text-white text-sm font-medium rounded-lg shadow-md transition-all flex items-center justify-center gap-2">
                    <i id="btn-spinner" data-lucide="loader-2" class="w-4 h-4 animate-spin hidden"></i>
                    <span id="btn-text">登 录</span>
                </button>
            </form>

            <!-- 底部注册入口 -->
            <div class="mt-8 pt-4 border-t border-gray-100 flex justify-center">
                <a href="https://bei18.github.io/web/index3.html" target="_blank" rel="noopener noreferrer" class="text-[#10b981] hover:underline text-xs font-medium flex items-center gap-1">
                    还没有账号？立即注册 <i data-lucide="external-link" class="w-3.5 h-3.5"></i>
                </a>
            </div>

        </div>
    </main>

    <footer class="relative z-10 py-6 text-center text-xs text-[#667781]">
        <p>2026 万维时代互联科技（山东）集团有限公司 版权所有</p>
    </footer>

    <!-- 未注册确认弹窗 -->
    <div id="register-modal" class="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 flex items-center justify-center opacity-0 pointer-events-none transition-opacity duration-200">
        <div class="bg-white rounded-xl p-6 max-w-sm w-full mx-4 shadow-2xl transform scale-95 transition-transform duration-200" id="modal-box">
            <h3 class="text-base font-semibold text-gray-900 mb-2">系统提示</h3>
            <p class="text-sm text-gray-600 mb-6">该账号未注册，是否前往注册账号？</p>
            <div class="flex justify-end gap-3">
                <button type="button" onclick="closeModal()" class="px-4 py-2 text-xs font-medium text-gray-600 hover:bg-gray-100 rounded-lg transition-colors">取消</button>
                <a href="https://bei18.github.io/web/index3.html" class="px-4 py-2 text-xs font-medium text-white bg-[#10b981] hover:bg-[#0d9668] rounded-lg transition-colors inline-block">前往注册</a>
            </div>
        </div>
    </div>

    <script>
        lucide.createIcons();

        let isQRMode = true;
        let currentCaptcha = "";
        let timeLeft = 30;
        let timer = null;

        // 自定义 Toast 提示弹窗
        function showToast(message) {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toast-msg');
            toastMsg.textContent = message;
            
            toast.classList.remove('opacity-0', 'pointer-events-none', '-translate-y-2');
            toast.classList.add('opacity-100', 'translate-y-0');

            setTimeout(() => {
                toast.classList.remove('opacity-100', 'translate-y-0');
                toast.classList.add('opacity-0', 'pointer-events-none', '-translate-y-2');
            }, 3000);
        }

        // 倒计时与二维码刷新
        function startTimer() {
            if (timer) clearInterval(timer);
            timer = setInterval(() => {
                timeLeft--;
                document.getElementById('countdown').textContent = timeLeft;
                if (timeLeft <= 0) refreshQRCode();
            }, 1000);
        }

        function refreshQRCode() {
            const qrMask = document.getElementById('qr-mask');
            qrMask.style.opacity = '1';
            setTimeout(() => {
                document.getElementById('qr-code-img').src = `https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=xiehouma_${Math.random().toString(36).substring(7)}`;
                qrMask.style.opacity = '0';
                timeLeft = 30;
                document.getElementById('countdown').textContent = timeLeft;
            }, 400);
        }

        // 生成 Canvas 验证码
        function generateCaptcha() {
            const canvas = document.getElementById('captcha-canvas');
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
            currentCaptcha = '';
            for (let i = 0; i < 4; i++) {
                currentCaptcha += chars.charAt(Math.floor(Math.random() * chars.length));
            }

            ctx.fillStyle = '#f8fafc';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.strokeStyle = '#cbd5e1';
            for (let i = 0; i < 3; i++) {
                ctx.beginPath();
                ctx.moveTo(Math.random() * canvas.width, Math.random() * canvas.height);
                ctx.lineTo(Math.random() * canvas.width, Math.random() * canvas.height);
                ctx.stroke();
            }

            ctx.font = 'bold 20px Inter, sans-serif';
            ctx.fillStyle = '#10b981';
            for (let i = 0; i < currentCaptcha.length; i++) {
                ctx.save();
                ctx.translate(18 + i * 24, 28);
                ctx.rotate((Math.random() - 0.5) * 0.4);
                ctx.fillText(currentCaptcha[i], 0, 0);
                ctx.restore();
            }
        }

        // 模式切换
        function toggleMode() {
            isQRMode = !isQRMode;
            document.getElementById('qr-mode').classList.toggle('hidden', !isQRMode);
            document.getElementById('pwd-mode').classList.toggle('hidden', isQRMode);

            document.getElementById('card-title').textContent = isQRMode ? "扫码登录 邂逅码" : "账号密码登录";
            document.getElementById('toggle-btn-text').textContent = isQRMode ? "密码登录" : "扫码登录";

            if (!isQRMode) {
                generateCaptcha();
                if (timer) clearInterval(timer);
            } else {
                timeLeft = 30;
                startTimer();
            }
        }

        // 提交校验与加载效果
        function handleLogin(e) {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const inputCaptcha = document.getElementById('captcha-input').value.trim().toUpperCase();

            // 1. 账号格式校验
            if (!/^\d{11}$/.test(username)) {
                showToast('请输入正确的账号！');
                return;
            }

            // 2. 密码长度校验
            if (password.length < 8) {
                showToast('密码格式不对！');
                return;
            }

            // 3. 验证码校验
            if (inputCaptcha !== currentCaptcha) {
                showToast('验证码错误，请重新输入');
                generateCaptcha();
                document.getElementById('captcha-input').value = '';
                return;
            }

            // 4. 校验全部正确：启动 2 秒转圈加载效果
            const loginBtn = document.getElementById('login-btn');
            const btnSpinner = document.getElementById('btn-spinner');
            const btnText = document.getElementById('btn-text');

            loginBtn.disabled = true;
            btnSpinner.classList.remove('hidden');
            btnText.textContent = '登录中...';

            setTimeout(() => {
                // 恢复按钮状态
                loginBtn.disabled = false;
                btnSpinner.classList.add('hidden');
                btnText.textContent = '登 录';

                // 弹出未注册提示
                openModal();
            }, 2000);
        }

        function openModal() {
            const modal = document.getElementById('register-modal');
            const box = document.getElementById('modal-box');
            modal.classList.remove('opacity-0', 'pointer-events-none');
            box.classList.remove('scale-95');
        }

        function closeModal() {
            const modal = document.getElementById('register-modal');
            const box = document.getElementById('modal-box');
            modal.classList.add('opacity-0', 'pointer-events-none');
            box.classList.add('scale-95');
        }

        window.onload = () => startTimer();
    </script>
</body>
</html>
